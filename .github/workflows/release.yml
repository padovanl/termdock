name: Release

# Pushing a version tag is what publishes a release — see
# scripts/release.sh, which is the supported way to create one (it
# refuses to tag anything but master, or a tree that doesn't match the
# remote, or a version that already exists).
#
# workflow_dispatch is kept alongside it purely as an escape hatch for
# re-running a release whose publish step failed; it builds from whatever
# ref you point it at, so the version it stamps comes from the nearest
# tag rather than from the run itself.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser derives the version and the changelog from tag
          # history, so a shallow clone gives it neither.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The tag is already pushed by the time this runs, so a failure
      # here means a tag exists with no release behind it — which is
      # recoverable (delete the tag, fix, tag again) in a way that a
      # published-but-broken release is not.
      - name: Test
        run: go test -race ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
