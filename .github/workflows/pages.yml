name: Pages

# Publishes site/ to https://padovanl.github.io/termdock/.
#
# Runs on master so the page always reflects what's merged, and on a
# release so the version and download links it shows are the current
# ones. Needs Pages enabled for the repo with "GitHub Actions" as the
# source (Settings → Pages) — once, by hand; a workflow can't turn it on
# for you.
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/demo.gif"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: a half-applied
# deploy would leave the published site in a state neither commit
# produced.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # The demo lives with the README's copy rather than being
          # duplicated in the repo.
          cp docs/demo.gif _site/demo.gif

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
