<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
  <title>termdock — a three-pane session, dracula theme</title>

  <!-- window chrome -->
  <rect x="0" y="0" width="960" height="560" rx="10" fill="#191a21"/>
  <rect x="0" y="0" width="960" height="32" rx="10" fill="#21222c"/>
  <rect x="0" y="10" width="960" height="22" fill="#21222c"/>
  <circle cx="24" cy="16" r="6" fill="#ff5555"/>
  <circle cx="44" cy="16" r="6" fill="#f1fa8c"/>
  <circle cx="64" cy="16" r="6" fill="#50fa7b"/>
  <text x="480" y="20" text-anchor="middle" font-size="13" fill="#6272a4">termdock — main</text>

  <!-- content area -->
  <rect x="0" y="32" width="960" height="496" fill="#282a36"/>

  <!-- left pane: 1:vim (active) -->
  <rect x="10" y="42" width="544" height="474" fill="none" stroke="#bd93f9" stroke-width="2"/>
  <rect x="24" y="34" width="76" height="16" fill="#282a36"/>
  <text x="28" y="46" font-size="13" fill="#bd93f9">1:vim</text>
  <g font-size="14" fill="#f8f8f2">
    <text x="30" y="80"><tspan fill="#ff79c6">func</tspan> <tspan fill="#50fa7b">main</tspan>() {</text>
    <text x="30" y="104">    fmt.<tspan fill="#50fa7b">Println</tspan>(<tspan fill="#f1fa8c">"listening on :8080"</tspan>)</text>
    <text x="30" y="128">    <tspan fill="#ff79c6">for</tspan> i := <tspan fill="#bd93f9">0</tspan>; i &lt; <tspan fill="#bd93f9">10</tspan>; i++ {</text>
    <text x="30" y="152">        <tspan fill="#8be9fd">go</tspan> worker(i)</text>
    <text x="30" y="176">    }</text>
    <text x="30" y="200">    <tspan fill="#ff79c6">if</tspan> err := srv.ListenAndServe(); err != <tspan fill="#ff79c6">nil</tspan> {</text>
    <text x="30" y="224">        log.<tspan fill="#50fa7b">Fatal</tspan>(err)</text>
    <text x="30" y="248">    }</text>
    <text x="30" y="272">}</text>
    <text x="30" y="320" fill="#6272a4">// Ctrl-B v/s split · Ctrl-B w jump · Ctrl-B g overview</text>
    <text x="30" y="344" fill="#6272a4">// Ctrl-B Q quick-jump · Ctrl-B : command · Ctrl-B L log</text>
  </g>

  <!-- top-right pane: 2:htop -->
  <rect x="566" y="42" width="384" height="228" fill="none" stroke="#44475a" stroke-width="1"/>
  <rect x="580" y="34" width="86" height="16" fill="#282a36"/>
  <text x="584" y="46" font-size="13" fill="#f8f8f2">2:htop</text>
  <g font-size="13" fill="#f8f8f2">
    <text x="586" y="76">CPU</text>
    <rect x="626" y="65" width="140" height="12" fill="#44475a"/>
    <rect x="626" y="65" width="88" height="12" fill="#50fa7b"/>
    <text x="774" y="76">62%</text>
    <text x="586" y="100">MEM</text>
    <rect x="626" y="89" width="140" height="12" fill="#44475a"/>
    <rect x="626" y="89" width="46" height="12" fill="#f1fa8c"/>
    <text x="774" y="100">31%</text>
    <text x="586" y="132" fill="#6272a4">PID   CMD</text>
    <text x="586" y="154">4210  node server.js</text>
    <text x="586" y="176">4288  go build ./...</text>
    <text x="586" y="198">4301  postgres</text>
    <text x="586" y="220">4355  <tspan fill="#8be9fd">docker</tspan> compose up</text>
  </g>

  <!-- bottom-right pane: 3:git -->
  <rect x="566" y="282" width="384" height="234" fill="none" stroke="#44475a" stroke-width="1"/>
  <rect x="580" y="274" width="66" height="16" fill="#282a36"/>
  <text x="584" y="286" font-size="13" fill="#f8f8f2">3:git</text>
  <g font-size="13" fill="#f8f8f2">
    <text x="586" y="316">* <tspan fill="#ffb86c">a1b2c3d</tspan> add quick-jump overlay</text>
    <text x="586" y="340">* <tspan fill="#ffb86c">9f8e7d6</tspan> fix pane-logging race</text>
    <text x="586" y="364">* <tspan fill="#ffb86c">4c5b6a7</tspan> add layout presets</text>
    <text x="586" y="388">* <tspan fill="#ffb86c">7d6e5f4</tspan> respawn-pane in place</text>
    <text x="586" y="412">* <tspan fill="#ffb86c">2a3b4c5</tspan> command prompt (Ctrl-B :)</text>
    <text x="586" y="448" fill="#6272a4">$ </text>
    <rect x="600" y="436" width="8" height="14" fill="#f8f8f2"/>
  </g>

  <!-- status bar -->
  <rect x="0" y="528" width="960" height="32" fill="#191a21"/>
  <text x="16" y="549" font-size="13" fill="#6272a4">termdock:main</text>
  <rect x="140" y="533" width="70" height="22" fill="#bd93f9"/>
  <text x="150" y="549" font-size="13" fill="#191a21">0:vim*</text>
  <text x="220" y="549" font-size="13" fill="#f8f8f2">1:htop</text>
  <text x="284" y="549" font-size="13" fill="#f8f8f2">2:git</text>
  <text x="944" y="549" text-anchor="end" font-size="13" fill="#6272a4">⎇ main | devbox 14:32 02-Jan-26</text>
</svg>
